<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Strength Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg:#E8EBE6; --surface:#FBFCFA; --ink:#1B2420; --muted:#6E7A73;
    --hair:#CBD2CA; --fresh:#2E6F5E; --aging:#A8842C; --stale:#7D2E3C;
    color-scheme: light; box-sizing:border-box;
    padding-top: env(safe-area-inset-top,0px);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; min-width:0; }
  html { -webkit-text-size-adjust:100%; overflow-x:hidden; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:15px; line-height:1.45; overflow-x:hidden; max-width:100%;
    padding-bottom:calc(60px + env(safe-area-inset-bottom,0px)); }
  .wrap { max-width:680px; margin:0 auto; padding:0 13px; }
  /* iOS zooms the page when a focused field is under 16px — that is what causes sideways drift */
  input, select, textarea, button { font-size:16px; max-width:100%; }
  input, select, textarea { -webkit-appearance:none; appearance:none; }
  select { background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),
    linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 15px) 50%, calc(100% - 10px) 50%;
    background-size:5px 5px, 5px 5px; background-repeat:no-repeat; padding-right:30px; }
  body::before { content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); background:var(--bg); z-index:30; }

  header { padding:12px 0 8px; border-bottom:2px solid var(--ink); display:flex;
    align-items:baseline; justify-content:space-between; gap:10px; }
  h1 { font-family:'Barlow Condensed','Arial Narrow',sans-serif; font-weight:700;
    font-size:25px; letter-spacing:.02em; text-transform:uppercase; margin:0; line-height:1; }
  .datestamp { font-family:'Barlow Condensed',sans-serif; font-size:12px;
    letter-spacing:.13em; text-transform:uppercase; color:var(--muted); }
  .syncchip { font-family:'Barlow Condensed',sans-serif; font-size:11px; letter-spacing:.1em;
    text-transform:uppercase; color:var(--muted); margin-top:2px; }
  .syncbox { background:var(--surface); border:1px solid var(--hair); border-radius:3px;
    padding:9px 11px; margin:0 0 10px; font-size:13px; }
  .syncbox b { font-family:'Barlow Condensed',sans-serif; font-size:10.5px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--muted); margin-right:7px; }
  .helptext { font-size:12px; color:var(--muted); margin:0 0 11px; line-height:1.5; }
  .helptext code { font-family:ui-monospace,Menlo,monospace; font-size:11.5px;
    background:#E4E9E2; padding:1px 4px; border-radius:2px; }

  nav { display:flex; border-bottom:1px solid var(--hair); background:var(--bg);
    position:sticky; top:env(safe-area-inset-top,0px); z-index:20; }
  nav button { flex:1; appearance:none; background:none; border:none; border-bottom:2px solid transparent;
    padding:11px 1px 9px; font-family:'Barlow Condensed',sans-serif; font-size:13px; font-weight:600;
    letter-spacing:.09em; text-transform:uppercase; color:var(--muted); cursor:pointer; }
  nav button[aria-selected="true"] { color:var(--ink); border-bottom-color:var(--ink); }

  /* ---------- filters ---------- */
  .filters { margin:11px 0 2px; }
  .fgrid { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .fgrid { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .filters input[type=search] {
    width:100%; max-width:100%; font:inherit; font-size:16px; padding:9px 10px;
    border:1px solid var(--hair); border-radius:2px; background:#fff; color:var(--ink); margin:0 0 5px; }
  .addbtn { width:100%; appearance:none; background:var(--ink); color:var(--surface); border:none;
    border-radius:2px; padding:11px; font-family:'Barlow Condensed',sans-serif; font-size:14px;
    font-weight:600; letter-spacing:.13em; text-transform:uppercase; cursor:pointer; margin:0 0 5px; }
  .filterbtn { width:100%; appearance:none; background:#fff; border:1px solid var(--hair);
    border-radius:2px; padding:8px 11px; cursor:pointer; display:flex; align-items:center;
    justify-content:space-between; gap:10px; font:inherit; color:inherit; text-align:left;
    margin:0 0 3px; min-height:40px; }
  .filterbtn .fl { font-family:'Barlow Condensed',sans-serif; font-size:11px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--muted); flex-shrink:0; }
  .filterbtn .fv { font-size:14px; font-weight:500; text-align:right; min-width:0;
    overflow-wrap:anywhere; }
  .filterbtn.on { border-color:var(--ink); }
  .clearf { appearance:none; background:none; border:none; color:var(--muted); cursor:pointer;
    font-family:'Barlow Condensed',sans-serif; font-size:11.5px; letter-spacing:.12em;
    text-transform:uppercase; padding:3px 0 5px; }

  /* ---------- history ---------- */
  .day { border-bottom:1px solid var(--hair); padding:8px 0 6px; }
  .day h3 { font-family:'Barlow Condensed',sans-serif; font-size:12.5px; font-weight:700;
    letter-spacing:.13em; text-transform:uppercase; margin:0 0 4px; }
  .day .count { color:var(--muted); font-weight:500; }
  .hitem { display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:var(--surface); border:1px solid var(--hair); border-radius:3px;
    padding:5px 9px; margin-bottom:3px; width:100%; text-align:left; font:inherit;
    color:inherit; appearance:none; cursor:pointer; min-height:30px; border-left-width:3px; }
  .hitem:active { background:#EAEFE9; }
  .hitem > span:first-child { min-width:0; overflow-wrap:anywhere; }
  .hitem .hn { font-size:13.5px; font-weight:500; }
  .hitem .hd { font-size:11.5px; color:var(--muted); margin-left:7px; }
  .hitem .hc { font-size:15px; color:var(--hair); flex-shrink:0; line-height:1; }
  .evt { display:block; width:100%; text-align:left; appearance:none; cursor:pointer;
    background:#F6EFE8; border:none; border-left:3px solid var(--stale); padding:6px 9px;
    margin:3px 0 4px; border-radius:0 3px 3px 0; font:inherit; font-size:13px; color:inherit; }
  .evt b { font-weight:600; }
  .evt span { font-size:11.5px; color:var(--muted); margin-left:7px; }

  /* ---------- log grids ---------- */
  .back { appearance:none; background:none; border:none; padding:13px 0 1px; cursor:pointer;
    font-family:'Barlow Condensed',sans-serif; font-size:13px; font-weight:600;
    letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
  .region { display:flex; align-items:baseline; justify-content:space-between; gap:10px;
    margin:14px 0 8px; padding-bottom:4px; border-bottom:2px solid var(--ink); }
  .region h2 { font-family:'Barlow Condensed',sans-serif; font-size:19px; font-weight:700;
    letter-spacing:.1em; text-transform:uppercase; margin:0; }
  .muscle { display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin:13px 0 5px; }
  .muscle h3 { font-family:'Barlow Condensed',sans-serif; font-size:12px; font-weight:600;
    letter-spacing:.18em; text-transform:uppercase; margin:0; color:var(--muted); }
  .rollup { font-family:'Barlow Condensed',sans-serif; font-size:12.5px; font-weight:600;
    letter-spacing:.09em; text-transform:uppercase; white-space:nowrap; }
  .rollup.big { font-size:14px; }

  .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:5px; width:100%; }
  .cell { appearance:none; background:var(--surface); border:1px solid var(--hair); border-radius:3px;
    padding:6px 8px; text-align:left; font:inherit; color:inherit; cursor:pointer; width:100%;
    display:flex; flex-direction:column; justify-content:center; min-height:40px;
    overflow:hidden; overflow-wrap:anywhere; }
  .cell:active { background:#EAEFE9; }
  .cell.done { border-color:var(--fresh); background:#F0F6F3; }
  .cell .n { font-size:13px; font-weight:500; line-height:1.2; }
  .cell .d { font-family:'Barlow Condensed',sans-serif; font-size:10.5px; letter-spacing:.06em;
    text-transform:uppercase; margin-top:1px; }
  .cell.pinned { border-color:var(--ink); }
  .pinmark { color:var(--ink); font-size:11px; margin-right:3px; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px;
    vertical-align:1px; flex-shrink:0; }
  .swatches { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .sw { width:36px; height:32px; border-radius:3px; border:2px solid transparent;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.12); cursor:pointer; appearance:none; padding:0; }
  .sw.on { border-color:var(--ink); }
  .pinhead { font-family:'Barlow Condensed',sans-serif; font-size:11px; font-weight:600;
    letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin:9px 0 4px; }
  .pinhead:first-child { margin-top:0; }
  .pinbtn { appearance:none; background:none; border:1px solid var(--hair); border-radius:2px;
    padding:6px 9px; font-family:'Barlow Condensed',sans-serif; font-size:12px; font-weight:600;
    letter-spacing:.1em; text-transform:uppercase; color:var(--muted); cursor:pointer;
    flex-shrink:0; white-space:nowrap; }
  .pinbtn.on { background:var(--ink); color:var(--surface); border-color:var(--ink); }
  .cell.grp { min-height:44px; border-left-width:4px; }
  .cell.tinted { border-left-width:3px; }
  .cell.sub { min-height:38px; background:#F2F5F1; }
  .cell.sub .n { font-family:'Barlow Condensed',sans-serif; font-size:15px; font-weight:700;
    letter-spacing:.11em; text-transform:uppercase; }
  .cell.grp .n { font-family:'Barlow Condensed',sans-serif; font-size:15px; font-weight:700;
    letter-spacing:.07em; text-transform:uppercase; }
  .cell.wide { grid-column:1 / -1; }
  .noex { font-size:12.5px; color:var(--muted); font-style:italic; padding:2px 0 6px; }
  .todaybar { background:#F0F6F3; border:1px solid var(--fresh); border-radius:3px;
    padding:9px 11px; margin:13px 0 11px; font-size:13px; }
  .todaybar b { display:block; font-family:'Barlow Condensed',sans-serif; font-size:11.5px;
    letter-spacing:.15em; text-transform:uppercase; color:var(--fresh); margin-bottom:2px; }

  /* ---------- coverage ---------- */
  .cov { padding:9px 0 7px; border-bottom:1px solid var(--hair); }
  .covtop { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .covname { font-family:'Barlow Condensed',sans-serif; font-size:15.5px; font-weight:600;
    letter-spacing:.06em; text-transform:uppercase; }
  .covregion { font-family:'Barlow Condensed',sans-serif; font-size:10.5px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--muted); }
  .track { height:6px; background:#DCE1DA; border-radius:1px; margin-top:7px; overflow:hidden; }
  .track i { display:block; height:100%; }
  .covsub { font-size:11.5px; color:var(--muted); margin-top:4px; }
  .days { font-family:'Barlow Condensed',sans-serif; font-size:23px; font-weight:700; line-height:1;
    white-space:nowrap; flex-shrink:0; }
  .days small { font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; }
  .days.word { font-size:13px; letter-spacing:.1em; text-transform:uppercase; font-weight:600; }

  /* ---------- modal ---------- */
  .overlay { position:fixed; inset:0; height:100vh; height:100dvh;
    background:rgba(27,36,32,.5); z-index:60;
    display:flex; align-items:flex-end; justify-content:center; }
  .sheet { background:var(--surface); width:100%; max-width:680px;
    max-height:92vh; max-height:92dvh; overflow-y:auto; -webkit-overflow-scrolling:touch;
    overflow-x:hidden; border-radius:11px 11px 0 0;
    padding:12px 14px calc(10px + env(safe-area-inset-bottom,0px)); }
  .sheethead > div { min-width:0; overflow-wrap:anywhere; }
  .sheethead { display:flex; align-items:baseline; justify-content:space-between; gap:10px;
    margin:0 0 11px; padding-bottom:8px; border-bottom:1px solid var(--hair); }
  .sheethead h4 { font-family:'Barlow Condensed',sans-serif; font-size:19px; font-weight:700;
    letter-spacing:.06em; text-transform:uppercase; margin:0; }
  .sheethead .sub { font-size:11.5px; color:var(--muted); font-family:'Barlow Condensed',sans-serif;
    letter-spacing:.12em; text-transform:uppercase; }
  .pk { font-family:'Barlow Condensed',sans-serif; font-size:11px; letter-spacing:.15em;
    text-transform:uppercase; color:var(--muted); margin:0 0 4px; }
  .pills { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:9px; max-width:100%; }
  .pill { appearance:none; background:#fff; border:1px solid var(--hair); border-radius:2px;
    padding:7px 9px; font:inherit; font-size:15px; color:var(--ink); cursor:pointer;
    min-width:40px; flex:0 0 auto; line-height:1.25; }
  .pill.on { background:var(--ink); color:var(--surface); border-color:var(--ink); }
  .num { width:78px; flex:0 0 auto; font:inherit; font-size:16px; padding:8px;
    border:1px solid var(--hair); border-radius:2px; background:#fff; }
  .sheet input[type=text], .sheet input[type=date], .sheet input[type=search],
  .sheet input[type=number], .sheet select {
    width:100%; max-width:100%; font:inherit; font-size:16px; padding:10px;
    border:1px solid var(--hair); border-radius:2px; background:#fff; color:var(--ink); margin:0 0 9px; }
  .sheet input[type=date] { min-height:42px; }
  /* must outrank the .sheet input[type=number] rule above, or these become full-width rows */
  .sheet input.num { width:84px; max-width:84px; flex:0 0 auto; padding:8px; margin:0; }
  .sheet .pk { margin:0 0 4px; }
  .pkrow { display:flex; align-items:center; justify-content:space-between; gap:6px; margin:0 0 5px; }
  .pkrow .pk { margin:0; flex-shrink:0; }
  .pkctl { display:flex; align-items:center; gap:4px; min-width:0; }
  .pill.sm { padding:5px 7px; font-size:13px; min-width:32px; }
  .sheet input.num.sm { width:60px; max-width:60px; padding:6px 7px; }
  .sheet .pills { margin-bottom:8px; gap:4px; }
  .pill sup { font-size:9.5px; font-weight:600; margin-left:2px; vertical-align:super; opacity:.75; }
  .seqline { background:#F0F6F3; border:1px solid var(--fresh); border-radius:2px;
    padding:7px 9px; margin:0 0 8px; font-size:13.5px; color:var(--ink); overflow-wrap:anywhere; }
  .seqline.none { background:#F2F5F1; border-color:var(--hair); color:var(--muted); }
  .seqline b { font-family:'Barlow Condensed',sans-serif; font-size:10.5px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--muted); margin-right:7px; }
  .sheet input[type=date] { margin-bottom:9px; }
  .sheethead { margin-bottom:9px; padding-bottom:7px; }
  .btnrow { display:flex; gap:6px; margin-top:4px; }
  /* keep Save/Cancel/Delete pinned to the bottom of the sheet, never scrolled off */
  .btnrow.stick { position:sticky; bottom:0; z-index:2; background:var(--surface);
    margin:10px -14px calc(-10px - env(safe-area-inset-bottom,0px));
    padding:9px 14px calc(9px + env(safe-area-inset-bottom,0px));
    border-top:1px solid var(--hair); }
  .btn { appearance:none; flex:1; background:var(--ink); color:var(--surface); border:none; border-radius:2px;
    padding:12px 6px; font-family:'Barlow Condensed',sans-serif; font-size:13.5px; font-weight:600;
    letter-spacing:.11em; text-transform:uppercase; cursor:pointer; }
  .btn.ghost { background:none; color:var(--muted); border:1px solid var(--hair); }
  .btn.danger { background:none; color:var(--stale); border:1px solid var(--stale); }
  .picklist { max-height:60vh; max-height:60dvh; overflow-y:auto; margin-bottom:9px; }
  .picklist .muscle { margin:9px 0 4px; }
  .picklist .grid { margin-bottom:2px; }

  /* ---------- edit tab ---------- */
  .editrow { display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--surface); border:1px solid var(--hair); border-radius:3px;
    padding:10px 12px; margin-bottom:4px; cursor:pointer; min-height:44px; }
  .panel { background:#F2F5F1; border:1px solid var(--hair); border-top:none;
    border-radius:0 0 3px 3px; padding:12px; margin:-5px 0 9px; }
  .chev { color:var(--muted); font-size:11.5px; font-family:'Barlow Condensed',sans-serif;
    letter-spacing:.1em; text-transform:uppercase; }
  .sectionhead { font-family:'Barlow Condensed',sans-serif; font-size:17px; font-weight:700;
    letter-spacing:.12em; text-transform:uppercase; margin:22px 0 4px; padding-bottom:4px;
    border-bottom:2px solid var(--ink); }
  .subhead { font-family:'Barlow Condensed',sans-serif; font-size:11px; font-weight:600;
    letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin:13px 0 5px; }
  label { display:block; font-family:'Barlow Condensed',sans-serif; font-size:11px;
    letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin:0 0 4px; }
  .panel input, .panel select, .add input, .add select, .add textarea {
    width:100%; max-width:100%; font:inherit; font-size:16px; padding:10px; border:1px solid var(--hair);
    border-radius:2px; background:#fff; color:var(--ink); margin-bottom:10px; }
  .editrow > span { min-width:0; overflow-wrap:anywhere; }
  .add textarea { min-height:84px; font-size:12px; font-family:ui-monospace,Menlo,monospace; }
  .checks { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:10px; }
  .chk { display:flex; align-items:center; gap:5px; font-size:12.5px; background:#fff;
    border:1px solid var(--hair); border-radius:2px; padding:5px 7px; cursor:pointer; }
  .chk input { margin:0; width:auto; }
  .add { background:var(--surface); border:1px dashed var(--hair); border-radius:3px;
    padding:12px; margin:9px 0 4px; }
  .empty { padding:34px 0; color:var(--muted); text-align:center; }
  .note { font-size:12px; color:var(--muted); margin:13px 0 0; }
  .warn { background:#F6EFE8; border:1px solid var(--stale); color:var(--stale);
    padding:9px 11px; border-radius:3px; font-size:13px; margin:11px 0; }
</style>

<div class="wrap"><header><h1>Strength Log</h1>
  <div style="text-align:right;min-width:0">
    <div class="datestamp" id="stamp">&nbsp;</div>
    <div class="syncchip" id="syncchip"></div>
  </div></header></div>

<nav role="tablist">
  <button role="tab" id="tab-hist" aria-selected="true"  onclick="setView('hist')">History</button>
  <button role="tab" id="tab-edit" aria-selected="false" onclick="setView('edit')">Edit</button>
</nav>

<div class="wrap"><div id="app"><div class="empty">Loading…</div></div></div>
<div id="modal"></div>

<script>

/* ======================= STORAGE ======================= */
const Store = {
  async get() {
    try { const v = localStorage.getItem(KEY); if (v) return v; } catch(e) {}
    try { if (window.storage) { const r = await window.storage.get(KEY); if (r && r.value) return r.value; } } catch(e) {}
    return null;
  },
  async set(v) {
    let ok = false;
    try { localStorage.setItem(KEY, v); ok = true; } catch(e) {}
    try { if (window.storage) { await window.storage.set(KEY, v); ok = true; } } catch(e) {}
    return ok;
  }
};

/* ============================ GitHub sync ============================
   localStorage is the working store; a JSON file in a private repo is the
   source of truth. Pull on open, debounced push after any change. The token
   lives in its own localStorage key and is never part of the synced data. */
const SYNC_KEY = 'strength-log-sync';
let sync = { owner:'', repo:'', path:'log.json', branch:'main', token:'' };
let syncState = { status:'off', msg:'Not connected', sha:null, busy:false, again:false };
let pushTimer = null;

function loadSync(){
  try { const v = localStorage.getItem(SYNC_KEY); if (v) Object.assign(sync, JSON.parse(v)); } catch(e){}
}
function saveSync(){
  try { localStorage.setItem(SYNC_KEY, JSON.stringify(sync)); } catch(e){}
}
const syncReady = () => !!(sync.owner && sync.repo && sync.path && sync.token);

function b64encode(str){
  const bytes = new TextEncoder().encode(str);
  let bin=''; for (const b of bytes) bin += String.fromCharCode(b);
  return btoa(bin);
}
function b64decode(b64){
  const bin = atob(String(b64).replace(/\s/g,''));
  return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
}
function setSync(status, msg){
  syncState.status = status; syncState.msg = msg;
  const el = document.getElementById('syncchip');
  if (el) el.innerHTML = syncChipHTML();
  const panel = document.getElementById('syncstatus');
  if (panel) panel.innerHTML = `<b>${esc(statusWord())}</b>${esc(msg)}`;
}
function statusWord(){
  return { off:'Not connected', ok:'Synced', syncing:'Working', error:'Problem' }[syncState.status] || '';
}
function syncChipHTML(){
  if (syncState.status === 'off') return '';
  const c = syncState.status==='ok' ? 'var(--fresh)'
          : syncState.status==='error' ? 'var(--stale)' : 'var(--aging)';
  return `<span style="color:${c}">●</span> ${esc(syncState.msg)}`;
}

async function ghFetch(method, body){
  const path = sync.path.split('/').map(encodeURIComponent).join('/');
  const base = `https://api.github.com/repos/${encodeURIComponent(sync.owner)}/${encodeURIComponent(sync.repo)}/contents/${path}`;
  const url = method==='GET' ? `${base}?ref=${encodeURIComponent(sync.branch||'main')}&_=${Date.now()}` : base;
  return fetch(url, {
    method, cache:'no-store',
    headers: Object.assign({
      'Authorization': 'Bearer ' + sync.token,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28'
    }, body ? {'Content-Type':'application/json'} : {}),
    body: body ? JSON.stringify(body) : undefined
  });
}
function ghError(code){
  if (code===401) return 'Token rejected';
  if (code===403) return 'Token lacks Contents write';
  if (code===404) return 'Repo or path not found';
  return 'GitHub error ' + code;
}
function normalize(d){
  if (!d.events) d.events = [];
  ensureColors(d);
  return d;
}

async function pullRemote(){
  if (!syncReady()) { setSync('off','Not connected'); return; }
  setSync('syncing','Checking…');
  let res;
  try { res = await ghFetch('GET'); }
  catch(e){ setSync('error', navigator.onLine === false ? 'Offline' : 'No connection'); return; }

  if (res.status === 404) {                 // first run: nothing in the repo yet
    syncState.sha = null;
    if (!state) { state = normalize(freshState()); await Store.set(JSON.stringify(state)); render(); }
    setSync('syncing','Creating file…');
    await pushNow();
    return;
  }
  if (!res.ok) { setSync('error', ghError(res.status)); return; }

  let remote;
  try { const j = await res.json(); syncState.sha = j.sha; remote = JSON.parse(b64decode(j.content)); }
  catch(e){ setSync('error','File is not valid JSON'); return; }

  const rT = remote.updatedAt || 0, lT = (state && state.updatedAt) || 0;
  if (rT > lT) {
    state = normalize(remote);
    await Store.set(JSON.stringify(state));
    setSync('ok','Loaded from GitHub');
    render();
  } else if (lT > rT) {
    setSync('syncing','Local is newer…');
    await pushNow();
  } else {
    setSync('ok','Up to date');
  }
}

async function pushNow(){
  if (!syncReady() || !state) return;
  if (syncState.busy) { syncState.again = true; return; }
  syncState.busy = true;
  setSync('syncing','Saving…');
  try {
    const body = {
      message: 'Strength log — ' + new Date().toISOString(),
      content: b64encode(JSON.stringify(state, null, 2)),
      branch: sync.branch || 'main'
    };
    if (syncState.sha) body.sha = syncState.sha;
    let res = await ghFetch('PUT', body);
    if (res.status === 409 || res.status === 422) {   // someone else wrote first
      const g = await ghFetch('GET');
      if (g.ok) { const j = await g.json(); syncState.sha = j.sha; body.sha = j.sha; res = await ghFetch('PUT', body); }
    }
    if (res.ok) { const j = await res.json(); syncState.sha = j.content.sha; setSync('ok','Saved'); }
    else setSync('error', ghError(res.status));
  } catch(e) {
    setSync('error', navigator.onLine === false ? 'Offline — will retry' : 'No connection');
  }
  syncState.busy = false;
  if (syncState.again) { syncState.again = false; pushNow(); }
}
function schedulePush(){
  if (!syncReady()) return;
  clearTimeout(pushTimer);
  setSync('syncing','Pending…');
  pushTimer = setTimeout(pushNow, 2000);     // batch rapid taps into one commit
}
async function saveSyncSettings(){
  sync.owner  = document.getElementById('s-owner').value.trim();
  sync.repo   = document.getElementById('s-repo').value.trim();
  sync.path   = document.getElementById('s-path').value.trim() || 'log.json';
  sync.branch = document.getElementById('s-branch').value.trim() || 'main';
  const t = document.getElementById('s-token').value.trim();
  if (t) sync.token = t;
  saveSync(); syncState.sha = null;
  render();
  await pullRemote();
}
function disconnectSync(){
  if (!confirm('Disconnect from GitHub? Your data stays on this device.')) return;
  sync = { owner:'', repo:'', path:'log.json', branch:'main', token:'' };
  saveSync(); syncState = { status:'off', msg:'Not connected', sha:null, busy:false, again:false };
  render();
}

async function load() {
  loadSync();

  if (raw) { try { data = JSON.parse(raw); } catch(e) { data=null; } }
  state = (data && Array.isArray(data.regions)) ? normalize(data) : null;
  ready = true;
  setSync(syncReady() ? 'syncing' : 'off', syncReady() ? 'Checking…' : 'Not connected');
  render();

async function save(d) {
  const obj = d || state;
  if (obj) obj.updatedAt = Date.now();
  const ok = await Store.set(JSON.stringify(obj));

  schedulePush();

}

/* ======================= HELPERS ======================= */
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function daysBetween(iso){ const [y,m,d]=iso.split('-').map(Number); const n=new Date();
  return Math.round((new Date(n.getFullYear(),n.getMonth(),n.getDate())-new Date(y,m-1,d))/86400000); }

function lastForMuscle(mid){ let b=null; for (const ex of exercisesTouching(mid)){ const e=lastEntry(ex.id); if(e&&(!b||e.d>b)) b=e.d; } return b; }
function lastForRegion(rid){ let b=null; for (const m of musclesIn(rid)){ const d=lastForMuscle(m.id); if(d&&(!b||d>b)) b=d; } return b; }
function tone(n){ if(n===null) return 'var(--muted)'; if(n<=4) return 'var(--fresh)'; if(n<=9) return 'var(--aging)'; return 'var(--stale)'; }
function rollup(iso,big){ const n=iso?daysBetween(iso):null;
  return `<span class="rollup ${big?'big':''}" style="color:${tone(n)}">${iso===null?'Never':n===0?'Today':n+'d ago'}</span>`; }
function bigDays(iso){
  if(!iso) return `<span class="days word" style="color:var(--muted)">Never</span>`;
  const n=daysBetween(iso);
  if(n===0) return `<span class="days word" style="color:${tone(0)}">Today</span>`;
  return `<span class="days" style="color:${tone(n)}">${n}<small>d</small></span>`;
}
function smallDays(iso){
  if(!iso) return `<span class="d" style="color:var(--muted)">Never</span>`;
  const n=daysBetween(iso);
  return `<span class="d" style="color:${tone(n)}">${n===0?'Today':n+'d ago'}</span>`;
}
function setsSummary(s){
  if(!s||!s.length) return '';
  const grp=[];
  for(const [w,r] of s){ const l=grp[grp.length-1];
    if(l && l.w===w && l.r===r) l.n++; else grp.push({w,r,n:1}); }
  return grp.map(g=>{
    let t = g.r ? g.n+'×'+g.r : g.n+(g.n===1?' set':' sets');
    if(g.w!=null) t += ' @ '+g.w+'kg';
    return t;
  }).join(', ');
}
function entrySummary(ex,e){
  if(!e) return '';
  const b=[];
  if(ex.kind==='cardio'){
    if(e.o!=null) b.push(e.o+' out'); if(e.c!=null) b.push(e.c+' cal'); if(e.m!=null) b.push(e.m+' min');
  } else { const s=setsSummary(e.s); if(s) b.push(s); }
  if(e.n) b.push(e.n);
  return b.join(' · ');
}
/* Weight buttons: a per-exercise ladder. ex.weights overrides, set in Edit.
   Heavy compounds get 50–120kg; everything else 5–60kg. */
const HEAVY = /squat|bench press|deadlift/i;
function ladder(from, to, step) { const a=[]; for (let v=from; v<=to; v+=step) a.push(v); return a; }
function defaultWeights(ex) {
  if (!HEAVY.test(ex.name)) return ladder(5,60,5);
  /* hex bar sits 4kg above the standard ladder */
  const offset = /hex/i.test(ex.name) ? 4 : 0;
  return ladder(50,120,5).map(w => w + offset);
}
function suggestWeights(id) {
  const ex = exById(id);
  if (ex && Array.isArray(ex.weights) && ex.weights.length) return ex.weights;
  return defaultWeights(ex);
}

/* Pinned exercises sort to the top of every exercise list. */
function sortPinned(list){ return list.slice().sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)); }
const pinnedExercises = () => state.exercises.filter(e=>e.pinned);

/* ======================= MODAL ======================= */
/* position within a day, so a session reads back in the order it was logged */
function nextOrderOn(d){
  let max = -1;
  for (const ex of state.exercises)
    for (const e of entries(ex.id))
      if (e.d === d && (e.i ?? 0) > max) max = e.i ?? 0;
  return max + 1;
}
function openDetail(exId, date, isNew) {
  const ex = exById(exId);
  const d = date || today();
  let e = entryOn(exId, d);
  if (!e && isNew !== false) { e = { d, i: nextOrderOn(d) }; (state.log[exId]=state.log[exId]||[]).push(e); state.log[exId].sort((a,b)=>a.d<b.d?-1:1); save(); }
  if (!e) return;
  const s = e.s || [];
  draft = { ws: s.map(x=>x[0]).filter(v=>v!=null), rs: s.map(x=>x[1]).filter(v=>v!=null),
            sets: s.length||null,
            note: e.n||'', o: e.o??'', c: e.c??'', m: e.m??'', date: d, origDate: d };
  modal = { kind:'detail', exId };
  render();
}
function openPick() { pickQuery=''; modal={kind:'pick', region:null}; render(); }
function closeModal() { modal=null; draft=null; render(); }

/* Weight and reps are ordered sequences: each tap adds the next set's value.
   Fewer values than sets means the last one carries forward. */
function seqAdd(f,v){
  const cap = draft.sets || 0;
  /* already filled every set? start the sequence over at this value */
  if (cap && draft[f].length >= cap) draft[f] = [v]; else draft[f].push(v);
  renderModal();
}
function seqUndo(f){ draft[f].pop(); renderModal(); }
function seqClear(f){ draft[f]=[]; renderModal(); }
function seqManual(f,raw){
  const v=parseFloat(raw); const a=draft[f];
  if(isNaN(v)){ if(a.length) a.pop(); } else if(a.length) a[a.length-1]=v; else a.push(v);
  updatePreview();
}
function nudge(d){
  const a=draft.ws;
  if(a.length) a[a.length-1]=Math.max(0,a[a.length-1]+d); else a.push(Math.max(0,d));
  renderModal();
}
function toggleSets(v){ draft.sets = (draft.sets===v)?null:v; renderModal(); }
function resolveSets(){
  const n = draft.sets || Math.max(draft.ws.length, draft.rs.length, 0);
  if(!n) return [];
  const at=(a,i)=> a.length ? a[Math.min(i,a.length-1)] : null;
  const out=[]; for(let i=0;i<n;i++) out.push([at(draft.ws,i), at(draft.rs,i)]);
  return out;
}
function previewHTML(){
  const r=resolveSets();
  return r.length
    ? `<b>This entry</b>${esc(setsSummary(r))}`
    : `<b>This entry</b>Logged with no sets recorded`;
}
function updatePreview(){
  const el=document.getElementById('seqline'); if(!el) return;
  el.className = 'seqline' + (resolveSets().length?'':' none');
  el.innerHTML = previewHTML();
}

async function saveDetail(exId) {
  const ex = exById(exId);
  const arr = state.log[exId] || [];
  let e = arr.find(x => x.d === draft.origDate);
  if (!e) { e = { d: draft.origDate }; arr.push(e); state.log[exId] = arr; }
  if (e.d !== draft.date) e.i = nextOrderOn(draft.date);
  e.d = draft.date;
  if (ex.kind === 'cardio') {
    const g = k => { const el=document.getElementById('d-'+k); const v=parseFloat(el?el.value:''); return isNaN(v)?undefined:v; };
    const o=g('o'), c=g('c'), m=g('m');
    if(o===undefined) delete e.o; else e.o=o;
    if(c===undefined) delete e.c; else e.c=c;
    if(m===undefined) delete e.m; else e.m=m;
  } else {
    const resolved = resolveSets();
    if(resolved.length) e.s = resolved; else delete e.s;
  }
  const note = (draft.note||'').trim();
  if(note) e.n = note; else delete e.n;
  state.log[exId].sort((a,b)=>a.d<b.d?-1:1);
  modal=null; draft=null; await commit();
}
async function deleteEntry(exId, date) {
  if(!confirm('Delete this entry?')) return;
  state.log[exId] = entries(exId).filter(e=>e.d!==date);

  modal=null; draft=null; await commit();
}

function matchesFilter(ex, e) {
  if (filters.ex && ex.id !== filters.ex) return false;
  if (filters.muscle && !ex.muscles.includes(filters.muscle)) return false;
  if (filters.region) {
    const ok = ex.muscles.some(mid => { const m = muscle(mid); return m && m.regionId === filters.region; });
    if (!ok) return false;
  }
  return true;
}
function clearFilters() { filters = { region:'', muscle:'', ex:'', evt:'' }; render(); }

function histListHTML() {
  const evFilter = filters.evt;
  const exFilter = filters.region || filters.muscle || filters.ex;
  const byDate = {};

  if (!evFilter) {
    for (const ex of state.exercises)
      for (const e of entries(ex.id))
        if (matchesFilter(ex,e)) (byDate[e.d] = byDate[e.d] || []).push({ex,e});
  }
  /* events keep their own days, unless an exercise filter is narrowing the view */
  const shownEvents = evFilter
    ? state.events.filter(ev => evFilter==='all' || ev.id===evFilter)
    : (exFilter ? [] : state.events);
  for (const ev of shownEvents) byDate[ev.start] = byDate[ev.start] || [];

  const dates = Object.keys(byDate).sort().reverse();
  if (!dates.length) return `<div class="empty">Nothing matches.</div>`;
  let h = '';
  for (const d of dates) {
    const items = byDate[d].sort((a,b) => (a.e.i ?? 0) - (b.e.i ?? 0));
    const evs = shownEvents.filter(ev => ev.end ? (d>=ev.start && d<=ev.end) : ev.start===d);
    const n = items.length + evs.length;
    h += `<div class="day"><h3>${prettyDate(d)} <span class="count">· ${n} item${n===1?'':'s'}</span></h3>`;
    h += evs.map(ev => `<button class="evt" onclick="openEvent('${ev.id}')">
      <b>${esc(ev.name)}</b>${ev.end?`<span>${prettyDate(ev.start)} – ${prettyDate(ev.end)}</span>`:''}</button>`).join('');
    for (const {ex,e} of items) {
      const sum = entrySummary(ex,e);
      h += `<button class="hitem" style="border-left-color:${exColor(ex)}" onclick="openDetail('${ex.id}','${d}',false)">
        <span><span class="hn">${esc(ex.name)}</span>${sum?`<span class="hd">${esc(sum)}</span>`:''}</span>
        <span class="hc">›</span></button>`;
    }
    h += `</div>`;
  }
  return h;
}

  if (!state) return h + `<p class="note">Everything else appears once a log is loaded.</p>`;
  const regionOpts = sel => state.regions.map(r=>`<option value="${r.id}" ${r.id===sel?'selected':''}>${esc(r.name)}</option>`).join('');
  const muscleOpts = sel => state.regions.map(r=>`<optgroup label="${esc(r.name)}">${musclesIn(r.id).map(m=>`<option value="${m.id}" ${m.id===sel?'selected':''}>${esc(m.name)}</option>`).join('')}</optgroup>`).join('');
  const kindOpts = sel => ['strength','cardio'].map(k=>`<option value="${k}" ${k===sel?'selected':''}>${k==='strength'?'Strength (sets/reps/weight)':'Cardio (output/calories/minutes)'}</option>`).join('');
  h += `<div class="sectionhead">Events</div>`;
  for (const ev of state.events.slice().sort((a,b)=>b.start<a.start?-1:1))
    h += `<div class="editrow"><span>${esc(ev.name)}<br><span class="chev">${prettyDate(ev.start)}${ev.end?' – '+prettyDate(ev.end):''}</span></span>
      <button class="pill" onclick="deleteEvent('${ev.id}')">Delete</button></div>`;
  h += `<div class="add"><label for="ev-name">New event</label><input type="text" id="ev-name" placeholder="e.g. Food poisoning">
    <label for="ev-start">Start</label><input type="date" id="ev-start" value="${today()}">
    <label for="ev-end">End (blank for a one-off)</label><input type="date" id="ev-end">
    <button class="btn" onclick="addEvent()">Add event</button></div>`;

  h += `<div class="sectionhead">Exercises</div>`;
  for (const r of state.regions) for (const m of musclesIn(r.id)) {
    const list = exercisesUnder(m.id); if (!list.length) continue;
    h += `<div class="subhead">${esc(r.name)} · ${esc(m.name)}</div>`;
    for (const ex of sortPinned(list)) {
      h += `<div class="editrow" onclick="expand('${ex.id}')"><span>${ex.pinned?'<span class="pinmark">★</span>':''}${esc(ex.name)}</span><span class="chev">${openEdit===ex.id?'Close':'Edit'}</span></div>`;
      if (openEdit===ex.id) h += `<div class="panel">
        <label>Name</label><input type="text" id="f-name" value="${esc(ex.name)}">
        <label>Files under</label><select id="f-primary">${muscleOpts(primaryOf(ex))}</select>
        <label>Type</label><select id="f-kind">${kindOpts(ex.kind||'strength')}</select>
        <label>Weight buttons (kg, comma separated — blank uses the default ladder)</label>
        <input type="text" id="f-weights" inputmode="decimal"
          value="${ex.weights&&ex.weights.length?ex.weights.join(', '):''}"
          placeholder="${defaultWeights(ex).join(', ')}">
        <label>Visibility</label><div class="checks">
          <label class="chk"><input type="checkbox" id="f-pinned" ${ex.pinned?'checked':''}>Pin to top of lists</label></div>
        <label>Also works</label><div class="checks">${state.muscles.map(mm=>
          `<label class="chk"><input type="checkbox" class="f-also" value="${mm.id}" ${ex.muscles.includes(mm.id)&&mm.id!==primaryOf(ex)?'checked':''}>${esc(mm.name)}</label>`).join('')}</div>
        <div class="btnrow"><button class="btn" onclick="saveExercise('${ex.id}')">Save</button>
        <button class="btn danger" onclick="deleteExercise('${ex.id}')">Delete</button></div></div>`;
    }
  }
  h += `<div class="add"><label>New exercise</label><input type="text" id="new-ex" placeholder="e.g. Incline dumbbell press">
    <label>Files under</label><select id="new-ex-muscle">${muscleOpts()}</select>
    <label>Type</label><select id="new-ex-kind">${kindOpts('strength')}</select>
    <button class="btn" onclick="addExercise()">Add exercise</button></div>`;

  h += `<div class="sectionhead">Muscles</div>`;
  for (const r of state.regions) {
    h += `<div class="subhead">${esc(r.name)}</div>`;
    for (const m of musclesIn(r.id)) {
      h += `<div class="editrow" onclick="expand('${m.id}')"><span><i class="dot" style="background:${muscleColor(m.id)}"></i>${esc(m.name)}</span><span class="chev">${openEdit===m.id?'Close':'Edit'}</span></div>`;
      if (openEdit===m.id) h += `<div class="panel">
        <label>Name</label><input type="text" id="f-name" value="${esc(m.name)}">
        <label>Group</label><select id="f-region">${regionOpts(m.regionId)}</select>
        <div class="btnrow"><button class="btn" onclick="saveMuscle('${m.id}')">Save</button>
        <button class="btn danger" onclick="deleteMuscle('${m.id}')">Delete</button></div></div>`;
    }
  }
  h += `<div class="add"><label>New muscle</label><input type="text" id="new-muscle" placeholder="e.g. Serratus">
    <label>Group</label><select id="new-muscle-region">${regionOpts()}</select>
    <button class="btn" onclick="addMuscle()">Add muscle</button></div>`;

  h += `<div class="sectionhead">Groups</div>`;
  for (const r of state.regions) {
    h += `<div class="editrow" onclick="expand('${r.id}')"><span><i class="dot" style="background:${r.color||'#5A6670'}"></i>${esc(r.name)}</span><span class="chev">${openEdit===r.id?'Close':'Edit'}</span></div>`;
    if (openEdit===r.id) h += `<div class="panel"><label>Name</label><input type="text" id="f-name" value="${esc(r.name)}">
      <label>Colour</label><div class="swatches">${PALETTE.map(c=>
        `<button class="sw ${r.color===c?'on':''}" style="background:${c}" onclick="setRegionColor('${r.id}','${c}')" aria-label="${c}"></button>`).join('')}</div>
      <div class="btnrow"><button class="btn" onclick="saveRegion('${r.id}')">Save</button>
      <button class="btn danger" onclick="deleteRegion('${r.id}')">Delete</button></div></div>`;
  }
  h += `<div class="add"><label>New group</label><input type="text" id="new-region" placeholder="e.g. Grip">
    <button class="btn" onclick="addRegion()">Add group</button></div>`;

  h += `<div class="sectionhead">Backup</div><div class="add">
    <button class="btn" onclick="exportData()">Export to a file</button>
    <p class="note" style="margin:10px 0 8px">Downloads everything as JSON. Take a copy before moving the app to a new address.</p>
    <label>Paste an export to restore</label><textarea id="importbox" placeholder='{"regions": …'></textarea>
    <button class="btn ghost" onclick="importData()">Import and replace</button></div>`;
  return h;
}

function setView(v) {
  view=v; openEdit=null; modal=null; draft=null;
  [['tab-hist','hist'],['tab-edit','edit']]
    .forEach(([i,k])=>document.getElementById(i).setAttribute('aria-selected',k===v?'true':'false'));
  render(); window.scrollTo(0,0);
}
function render() {
  if (!ready) return;
  document.getElementById('stamp').textContent =
    new Date().toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
  const chip = document.getElementById('syncchip');
  if (chip) chip.innerHTML = syncChipHTML();
  document.getElementById('app').innerHTML =
    view==='hist' ? (state ? viewHistory() : viewEmpty()) : viewEdit();
  renderModal();
}
/* retry when the connection or the app comes back */
window.addEventListener('online', () => { if (ready && syncReady()) pullRemote(); });
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && ready && syncReady() && syncState.status !== 'syncing') pullRemote();
});

load();
</script>
